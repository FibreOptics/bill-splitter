<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#122b28">
<title>Bill Splitter</title>
<style>
  :root {
    --table: #122b28;      /* dark felt the receipt sits on */
    --paper: #fdfcf7;      /* thermal paper */
    --ink: #21252b;
    --ink-soft: #6b7280;
    --rule: #c9c6ba;
    --debt: #b3372c;       /* cashier red */
    --paid: #1e6e4e;       /* stamp green */
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--table);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .receipt {
    max-width: 430px;
    margin: 18px auto 48px;
    background: var(--paper);
    padding: 26px 18px 34px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    position: relative;
  }
  /* signature: perforated tear edge */
  .receipt::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -12px; height: 12px;
    background:
      linear-gradient(-45deg, transparent 8px, var(--paper) 0) 0 0 / 16px 12px repeat-x,
      linear-gradient(45deg, transparent 8px, var(--paper) 0) 8px 0 / 16px 12px repeat-x;
  }
  header { text-align: center; margin-bottom: 10px; }
  h1 {
    font-size: 1.05rem;
    letter-spacing: .35em;
    margin: 0 0 2px;
    text-transform: uppercase;
  }
  .tagline { margin: 0; color: var(--ink-soft); font-size: .72rem; letter-spacing: .12em; }

  h2 {
    font-size: .72rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-soft);
    margin: 22px 0 12px;
  }
  h2::before { content: " · "; }
  details.section { border-top: 1px dashed var(--rule); padding-top: 2px; }
  details.section > summary { list-style: none; cursor: pointer; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary h2::after { content: " ▾"; }
  details.section:not([open]) > summary h2::after { content: " ▸"; }

  input, button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 9px 10px;
    min-height: 40px;
  }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  form input { flex: 1; min-width: 0; }
  form button { border-color: var(--ink); }

  /* person chips (roster) */
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 6px 4px 6px 10px; margin: 3px 6px 3px 0;
    min-height: 40px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip button { border: none; min-height: 0; padding: 2px 8px; font-size: 1rem; color: var(--ink-soft); }

  /* items */
  .item { border-top: 1px dashed var(--rule); padding: 12px 0 14px; }
  .item:first-child { border-top: none; }
  .itemRow { display: flex; gap: 8px; }
  .itemName { flex: 1; min-width: 0; border-color: transparent; padding-left: 2px; }
  .itemName:hover, .itemName:focus { border-color: var(--rule); }
  .itemPrice { width: 96px; text-align: right; }
  .deleteItem { border-color: transparent; color: var(--ink-soft); }

  .splitRow { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .splitLabel {
    flex: 0 0 5.4em;
    font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 5px 10px; margin: 2px 4px 2px 0; min-height: 36px;
    background: transparent; color: var(--ink-soft);
  }
  .tag .dot { opacity: .45; }
  .tag.on { color: var(--ink); border-color: var(--ink); }
  .tag.on .dot { opacity: 1; }
  .payerRow .tag.on { border-color: var(--paid); color: var(--paid); font-weight: 700; }
  .shareNote { font-size: .72rem; color: var(--ink-soft); margin-top: 6px; padding-left: calc(5.4em + 8px); }
  .warn { color: var(--debt); font-size: .74rem; margin-top: 8px; }
  .invalid { box-shadow: inset 3px 0 0 var(--debt); padding-left: 8px; }

  /* scan */
  .scanRow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  label.fileButton {
    border: 1px solid var(--ink); border-radius: 2px;
    padding: 9px 14px; cursor: pointer; min-height: 40px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  #receiptFile { display: none; }
  label.fileButton.disabled { opacity: .45; }
  #ocrStatus { color: var(--ink-soft); font-size: .78rem; }

  /* settlement */
  .total { display: flex; justify-content: space-between; color: var(--ink-soft); font-size: .8rem; margin: 4px 0 10px; }
  .transfer {
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 0; border-top: 1px dashed var(--rule);
    font-size: 1.02rem;
  }
  .transfer:first-of-type { border-top: none; }
  .transfer .who { flex: 1; }
  .transfer .arrow { color: var(--ink-soft); }
  .transfer .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
  .settled { text-align: center; color: var(--paid); letter-spacing: .18em; font-size: .8rem; padding: 14px 0; }
  .balances { margin-top: 12px; border-top: 1px dashed var(--rule); padding-top: 8px; }
  .balanceRow { display: flex; gap: 8px; align-items: baseline; font-size: .82rem; padding: 5px 0; }
  .balanceRow .who { flex: 1; }
  .balanceRow .paidNote { color: var(--ink-soft); font-size: .74rem; }
  .pos { color: var(--paid); } .neg { color: var(--debt); }

  #clearAll {
    display: block; margin: 8px auto 0;
    border: none; color: var(--ink-soft);
    font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .muted { color: var(--ink-soft); font-size: .8rem; }
  @media (prefers-reduced-motion: no-preference) {
    .tag { transition: color .12s, border-color .12s; }
  }
</style>
</head>
<body>
<main class="receipt">
  <header>
    <h1>Bill Splitter</h1>
    <p class="tagline">itemized · tagged · settled</p>
  </header>

  <details class="section" open>
    <summary><h2>People</h2></summary>
    <div id="peopleList"></div>
    <form id="personForm">
      <input id="personName" placeholder="Add a name" autocomplete="off">
      <button>Add</button>
    </form>
  </details>

  <details class="section" open>
    <summary><h2>Items</h2></summary>
    <div class="scanRow">
      <label class="fileButton" id="scanButton">📷 Scan receipt
        <input id="receiptFile" type="file" accept="image/*">
      </label>
      <span id="ocrStatus"></span>
    </div>
    <div id="itemsList"></div>
    <form id="itemForm">
      <input id="newItemName" placeholder="Item name" autocomplete="off">
      <input id="newItemPrice" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" style="flex:0 1 110px; text-align:right">
      <button>Add</button>
    </form>
  </details>

  <details class="section" open>
    <summary><h2>Who pays who</h2></summary>
    <div id="settlement"></div>
    <button id="clearAll">Start a new bill</button>
  </details>
</main>

<script src="app.js"></script>
</body>
</html>
